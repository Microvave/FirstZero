<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนู</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #f5f5f5;
        color: #333333;
        max-width: 600px;
        margin: 0 auto;
      }

      main {
        display: flex;
        gap: 16px;
      }

      section {
        background-color: #ffffff;
        padding: 20px;
        margin: 20px 0;
        border: 1px solid #dddddd;
        border-radius: 8px;
        flex: 1;
        text-align: center;
      }

      h2 {
        color: #8b05a6;
      }

      @media (max-width: 600px) {
        body {
          padding: 0 16px;
        }

        main {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h2>มาม่า</h2>
        <p>20 บาท</p>
      </section>
      <section>
        <h2>มาม่าผัด</h2>
        <p>100 บาท</p>
      </section>
      <section>
        <h2>มาม่าทอด</h2>
        <p>60 บาท</p>
      </section>
    </main>
  </body>
</html>
